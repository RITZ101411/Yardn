apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploy-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RITZ101411/deploy.git
    targetRevision: main
    path: manifests/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: deploy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
