apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: deploy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/ritz101411/deploy-api
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CONTROLLER_URL
              value: "http://controller.deploy-system.svc.cluster.local:3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deploy-database
                  key: url
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: deploy-auth
                  key: secret
            - name: BETTER_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: deploy-auth
                  key: url
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: deploy-auth
                  key: trusted-origins
                  optional: true
            - name: AUTH_SIGN_UP_ENABLED
              valueFrom:
                secretKeyRef:
                  name: deploy-auth
                  key: sign-up-enabled
                  optional: true
            - name: REDIS_HOST
              value: redis.deploy-system.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
