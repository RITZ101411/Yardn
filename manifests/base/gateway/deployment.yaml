apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: deploy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/ritz101411/deploy-gateway
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CONTROLLER_URL
              value: "http://controller.deploy-system.svc.cluster.local:3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deploy-database
                  key: url
