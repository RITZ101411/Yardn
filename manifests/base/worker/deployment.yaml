apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: deploy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/ritz101411/deploy-api
          command: ["node", "dist/worker.js"]
          env:
            - name: CONTROLLER_URL
              value: "http://controller.deploy-system.svc.cluster.local:3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deploy-database
                  key: url
            - name: REDIS_HOST
              value: redis.deploy-system.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
